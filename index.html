<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fvc Project Srl</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding-bottom: 60px;
        }
        header {
            background-color: #1e1e1e;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #D4AF37;
        }
        header h1 {
            margin: 0;
            color: #D4AF37;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .product-card, .news-item, .operator-card {
            background-color: #1e1e1e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .product-card h3, .news-item h4 {
            margin: 0;
            color: #00f2ff;
        }
        .price {
            font-weight: bold;
            color: #D4AF37;
        }
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #1e1e1e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 2px solid #D4AF37;
        }
        nav div {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            cursor: pointer;
        }
        nav div i {
            font-size: 20px;
            display: block;
        }
        nav div.active {
            color: #D4AF37;
        }
        .operator-badge {
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Fvc Project Srl</h1>
</header>

<div id="home" class="tab-content active">
    <h2>News</h2>
    <div id="news-container">Caricamento news...</div>
</div>

<div id="catalogo" class="tab-content">
    <h2>Catalogo</h2>
    <div id="product-container">Caricamento prodotti...</div>
</div>

<div id="gestori" class="tab-content">
    <h2>Offerte Gestori</h2>
    <div id="operator-container">Caricamento offerte...</div>
</div>

<div id="servizi" class="tab-content">
    <h2>Servizi</h2>
    <div class="product-card">
        <h3>Riparazioni</h3>
        <p>Riparazione smartphone e tablet.</p>
    </div>
    <div class="product-card">
        <h3>Attivazioni</h3>
        <p>SIM e contratti fibra.</p>
    </div>
</div>

<nav>
    <div onclick="showTab('home')" id="nav-home" class="active"><i class="fas fa-home"></i>Home</div>
    <div onclick="showTab('catalogo')" id="nav-catalogo"><i class="fas fa-mobile-alt"></i>Catalogo</div>
    <div onclick="showTab('gestori')" id="nav-gestori"><i class="fas fa-sim-card"></i>Gestori</div>
    <div onclick="showTab('servizi')" id="nav-servizi"><i class="fas fa-tools"></i>Servizi</div>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2Iu5G6G7G8G9G0G1G2G3G4G5G6G7G8G9",
        authDomain: "fvc-app-79872.firebaseapp.com",
        projectId: "fvc-app-79872",
        storageBucket: "fvc-app-79872.appspot.com",
        messagingSenderId: "333240213745",
        appId: "1:333240213745:web:c67425f1789886259e8633"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav div').forEach(nav => nav.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');
    }

    db.collection("prodotti").onSnapshot(snapshot => {
        const container = document.getElementById("product-container");
        container.innerHTML = "";
        snapshot.forEach(doc => {
            const p = doc.data();
            container.innerHTML += `<div class="product-card"><h3>${p.modello}</h3><p>Marca: ${p.marca}</p><p class="price">€ ${p.prezzo}</p></div>`;
        });
    });

    db.collection("news").orderBy("data", "desc").onSnapshot(snapshot => {
        const container = document.getElementById("news-container");
        container.innerHTML = "";
        snapshot.forEach(doc => {
            const n = doc.data();
            container.innerHTML += `<div class="news-item"><h4>${n.titolo}</h4><p>${n.testo}</p></div>`;
        });
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
