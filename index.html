<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fvc Project Srl</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #0b0d11;
            --card-bg: rgba(25, 28, 35, 0.8);
            --gold: linear-gradient(135deg, #D4AF37 0%, #f9e297 50%, #b49437 100%);
            --gold-solid: #D4AF37;
            --text-main: #ffffff;
            --text-dim: #a0a6b1;
            --glass-border: rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, #1a1e26, #0b0d11);
            background-attachment: fixed;
        }

        header {
            background: rgba(11, 13, 17, 0.9);
            backdrop-filter: blur(15px);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }

        nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(25, 28, 35, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 1000;
        }

        nav div {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            transition: all 0.3s ease;
            flex: 1;
            cursor: pointer;
        }

        nav div i {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 5px;
        }

        nav div.active {
            color: var(--gold-solid);
            transform: translateY(-3px);
        }

        .tab-content {
            display: none;
            padding: 20px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active {
            display: block;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gold);
        }

        .price-tag {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 15px;
            background: var(--gold);
            color: #000;
            font-weight: 800;
            border-radius: 10px;
        }

        .news-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--gold-solid);
        }

        h2 {
            font-size: 1.5rem;
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FVC PROJECT</h1>
    </header>

    <div id="home" class="tab-content active">
        <h2>News & Novità</h2>
        <div id="news-container"></div>
    </div>

    <div id="catalogo" class="tab-content">
        <h2>Catalogo</h2>
        <div id="product-container"></div>
    </div>

    <div id="gestori" class="tab-content">
        <h2>Offerte Gestori</h2>
        <div id="operator-container"></div>
    </div>

    <div id="servizi" class="tab-content">
        <h2>Servizi</h2>
        <div class="product-card">
            <h3>Riparazioni</h3>
            <p>Interventi rapidi su smartphone e tablet.</p>
        </div>
        <div class="product-card">
            <h3>Attivazioni</h3>
            <p>SIM e contratti fibra/adsl.</p>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="showTab('home')">
            <i class="fas fa-home"></i>Home
        </div>
        <div class="nav-item" onclick="showTab('catalogo')">
            <i class="fas fa-mobile-alt"></i>Prodotti
        </div>
        <div class="nav-item" onclick="showTab('gestori')">
            <i class="fas fa-sim-card"></i>Offerte
        </div>
        <div class="nav-item" onclick="showTab('servizi')">
            <i class="fas fa-tools"></i>Servizi
        </div>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2...", 
            authDomain: "fvc-app-79872.firebaseapp.com",
            projectId: "fvc-app-79872",
            storageBucket: "fvc-app-79872.appspot.com",
            messagingSenderId: "333240213745",
            appId: "1:333240213745:web:c67425f1789886259e8633"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        db.collection("prodotti").onSnapshot(s => {
            const c = document.getElementById("product-container");
            c.innerHTML = "";
            s.forEach(doc => {
                const p = doc.data();
                c.innerHTML += `<div class="product-card"><h3>${p.modello}</h3><p>${p.marca}</p><div class="price-tag">€ ${p.prezzo}</div></div>`;
            });
        });

        db.collection("news").orderBy("data", "desc").onSnapshot(s => {
            const c = document.getElementById("news-container");
            c.innerHTML = "";
            s.forEach(doc => {
                const n = doc.data();
                c.innerHTML += `<div class="news-item"><h4>${n.titolo}</h4><p>${n.testo}</p></div>`;
            });
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
