<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Fvc Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1116;
            --card-bg: #1e2128;
            --gold: #D4AF37;
            --danger: #ff4d4d;
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        header h1 { color: var(--gold); margin: 0; }
        
        .admin-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .admin-card h2 { color: var(--gold); margin-top: 0; font-size: 1.2rem; }
        
        input[type="file"], input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #000;
            color: white;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary { background: var(--gold); color: black; }
        .btn-danger { background: var(--danger); color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .maintenance-zone {
            border: 1px dashed var(--danger);
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 77, 77, 0.05);
        }
        .status-msg { font-size: 0.8rem; color: var(--gold); margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Fvc Admin Panel</h1>
    </header>

    <!-- Caricamento Excel -->
    <div class="admin-card">
        <h2><i class="fas fa-file-excel"></i> Carica Prodotti da Excel</h2>
        <input type="file" id="excelInput" accept=".xlsx, .xls">
        <button class="btn-primary" onclick="uploadExcel()">Importa Dati</button>
        <div id="uploadStatus" class="status-msg"></div>
    </div>

    <!-- SEZIONE RESET (MANUTENZIONE) -->
    <div class="admin-card maintenance-zone">
        <h2 style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> Manutenzione Database</h2>
        <p>Utilizza questi tasti per pulire il database prima di un nuovo caricamento.</p>
        
        <button class="btn-danger" onclick="confirmReset('prodotti')">
            <i class="fas fa-trash"></i> Reset Catalogo Smartphone
        </button>
        
        <button class="btn-danger" onclick="confirmReset('news')">
            <i class="fas fa-trash"></i> Reset News
        </button>

        <button class="btn-danger" onclick="confirmReset('offerte')">
            <i class="fas fa-trash"></i> Reset Offerte Gestori
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // INSERISCI QUI LA TUA API KEY REALE
    const firebaseConfig = {
        apiKey: "AIzaSyC2Iu5G6G7G8G9G0G1G2G3G4G5G6G7G8G9", 
        authDomain: "fvc-app-79872.firebaseapp.com",
        projectId: "fvc-app-79872",
        storageBucket: "fvc-app-79872.appspot.com",
        messagingSenderId: "333240213745",
        appId: "1:333240213745:web:c67425f1789886259e8633"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // FUNZIONE DI RESET POTENZIATA (Gestisce oltre 500 documenti)
    async function deleteCollection(collectionPath) {
        const collectionRef = db.collection(collectionPath);
        const query = collectionRef.limit(500); // Prende blocchi da 500

        return new Promise((resolve, reject) => {
            deleteQueryBatch(query, resolve, reject);
        });
    }

    async function deleteQueryBatch(query, resolve, reject) {
        const snapshot = await query.get();

        // Se la collezione è vuota, abbiamo finito
        if (snapshot.size === 0) {
            resolve();
            return;
        }

        const batch = db.batch();
        snapshot.docs.forEach((doc) => {
            batch.delete(doc.ref);
        });

        await batch.commit();

        // Aspetta un secondo e ripeti (ricorsione) per il prossimo blocco
        setTimeout(() => {
            deleteQueryBatch(query, resolve, reject);
        }, 1000);
    }

    async function confirmReset(collectionName) {
        const result = await Swal.fire({
            title: 'Sei sicuro?',
            text: `Questa azione eliminerà TUTTI i documenti in "${collectionName}". Non potrai tornare indietro!`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ff4d4d',
            confirmButtonText: 'Sì, elimina tutto!',
            cancelButtonText: 'Annulla'
        });

        if (result.isConfirmed) {
            Swal.fire({
                title: 'Eliminazione in corso...',
                text: 'Sto svuotando la collezione a blocchi di 500...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                await deleteCollection(collectionName);
                Swal.fire('Resettato!', `La sezione ${collectionName} è ora vuota.`, 'success');
            } catch (error) {
                Swal.fire('Errore', 'Errore durante l\'eliminazione: ' + error.message, 'error');
            }
        }
    }

    // CARICAMENTO EXCEL (Mantenuto e ottimizzato)
    function uploadExcel() {
        const file = document.getElementById('excelInput').files[0];
        if (!file) return Swal.fire('Errore', 'Seleziona un file Excel', 'error');

        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);

            Swal.fire({ 
                title: 'Importazione in corso...', 
                text: `Caricamento di ${json.length} prodotti...`,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading() 
            });

            try {
                // Carichiamo i prodotti uno ad uno (Firebase gestisce bene le code di scrittura)
                let count = 0;
                for (let item of json) {
                    await db.collection("prodotti").add({
                        marca: item.Marca || item.marca || 'N/A',
                        modello: item.Modello || item.modello || 'N/A',
                        prezzo: item.Prezzo || item.prezzo || 0,
                        descrizione: item.Descrizione || item.descrizione || '',
                        data: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    count++;
                }
                Swal.fire('Completato', `Importati con successo ${count} prodotti.`, 'success');
            } catch (err) {
                Swal.fire('Errore', 'Si è verificato un errore durante l\'upload: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
